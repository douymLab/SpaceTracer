site_name: SpaceTracer
site_url: https://douymLab.github.io/SpaceTracer/
repo_url: https://github.com/douymLab/SpaceTracer
repo_name: SpaceTracer
edit_uri: edit/main/docs/

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Installation: installation.md
  - Resources: resources.md
  - Configuration: configuration.md
  - Config Reference: config-reference.md
  - Quick Start: quickstart.md
  - Outputs: outputs.md
  - Step Reference:
    - Code-aligned step map: steps/overview.md
    - Step 0 - Cluster Preparation:
      - Overview: steps/step0-cluster.md
      - cluster: steps/cluster.md
    - Step 1 - BAM Processing:
      - Overview: steps/step1-bam-processing.md
      - bam_processing: steps/bam-processing.md
    - Step 2 - Pileup Candidate Sites:
      - Overview: steps/step2-mpileup.md
      - mpileup: steps/mpileup.md
    - Step 3 - Count and Prior Construction:
      - Overview: steps/step3-count-and-prior-construction.md
      - umi_combine: steps/umi-combine.md
      - cell_num: steps/cell-num.md
      - prior: steps/prior.md
    - Step 4 - Genotyping:
      - Overview: steps/step4-genotyping.md
      - genotyping: steps/genotyping.md
    - Step 5 - Feature Extraction and Phasing:
      - Overview: steps/step5-feature-extraction.md
      - spatial_feature: steps/spatial-feature.md
      - mappability_feature: steps/mappability-feature.md
      - read_feature: steps/read-feature.md
      - RNA_feature: steps/rna-feature.md
      - phasing: steps/phasing.md
    - Step 6 - Feature Merge and Filtration:
      - Overview: steps/step6-merge-filtration.md
      - merge_feature: steps/merge-feature.md
    - Step 7 - Mutation Prediction:
      - Overview: steps/step7-mutation-prediction.md
      - mutation_prediction: steps/mutation-prediction.md
    - Post-step - Phylogeny: steps/post-phylogeny.md
    - Single-Step Debug Cookbook: steps/debug-cookbook.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-code.js

strict: true
