  - samtools=1.23
  - bedtools=2.31.1
  - bcftools=1.23.1
  - htslib=1.23

  # ========== PyTorch ==========
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.1

  # ========== Jupyter ==========
