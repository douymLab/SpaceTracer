name: SpaceTracer_minimal
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ========== Python ==========
  - python=3.9.23
  - pip=25.2

  # ========== Core scientific stack ==========
  - numpy=1.26.4
  - pandas=2.3.1
  - scipy=1.13.1
  - numba=0.60.0
  - scikit-learn=1.4.1.post1
  - statsmodels=0.14.5
  - joblib=1.5.1
  - tqdm=4.67.1

  # ========== Single-cell / spatial ==========
  - scanpy=1.10.3
  - anndata=0.10.9
  - umap-learn=0.5.9.post2
  - leidenalg=0.10.2
  - louvain=0.8.2
  - igraph=0.10.16
  - h5py=3.14.0

  # ========== Visualization ==========
  - matplotlib=3.9.4
  - seaborn=0.13.2
  - colorcet=3.1.0
  - wordcloud=1.9.4
  - folium=0.20.0
  - pygments=2.19.2

  # ========== Geo / spatial analysis ==========
  - geopandas=1.0.1
  - shapely=2.0.7
  - pyproj=3.6.1
  - fiona=1.10.1
